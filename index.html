<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="通勤">
<meta name="theme-color" content="#0f1720">
<title>林口南港通勤</title>
<style>
:root{
  --bg:#f3f4f1;--card:#ffffff;--ink:#14181d;--sub:#5d6670;--line:#e2e4df;
  --mrt:#7a3fa6;--tra:#1f5fbf;--hsr:#e0661c;--ok:#1d8a4e;--warn:#c98a00;--bad:#c7392f;
  --pick:#fff6d8;--chip:#eef0ec;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1720;--card:#18222d;--ink:#eef1f4;--sub:#93a0ad;--line:#26323e;
  --mrt:#b585df;--tra:#6ea3f2;--hsr:#f39a5e;--ok:#4cc386;--warn:#e7b53f;--bad:#f0756b;
  --pick:#2d2a17;--chip:#223040;
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 28px);max-width:560px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:12px}
.clock{font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.date{color:var(--sub);font-size:13px;margin-top:4px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.status{font-size:12px;color:var(--sub);margin:0 2px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub);display:inline-block}
.dot.live{background:var(--ok)}.dot.off{background:var(--warn)}
.plan{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.plan h2{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px}
.route{display:flex;flex-direction:column;gap:6px}
.leg{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;min-width:42px;text-align:center}
.t-mrt{background:var(--mrt)}.t-tra{background:var(--tra)}.t-hsr{background:var(--hsr)}.t-walk{background:var(--sub)}
.leg b{font-size:18px}
.leg .s{color:var(--sub);font-size:13px}
.leg .s[style]{white-space:nowrap}
.verdict{margin-top:10px;font-size:15px;font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.warn{color:var(--warn)}.verdict.bad{color:var(--bad)}
section{background:var(--card);border-radius:16px;margin-bottom:12px;border:1px solid var(--line);overflow:hidden}
section h3{display:flex;align-items:center;gap:8px;font-size:15px;padding:12px 16px 8px}
section h3 .sub{color:var(--sub);font-weight:500;font-size:12px;margin-left:auto}
.bar{width:4px;height:16px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--sub);font-weight:600;text-align:left;padding:4px 16px 6px}
td{padding:9px 16px;border-top:1px solid var(--line);font-size:15px;white-space:nowrap}
td.n{color:var(--sub);font-size:13px}
td.r{text-align:right}
tr.pick td{background:var(--pick)}
tr.gone td{opacity:.38}
tr[data-i]{cursor:pointer}
.mins{font-size:12px;color:var(--sub)}
.late{color:var(--bad);font-weight:700;font-size:12px}
.ontime{color:var(--ok);font-size:12px}
.k{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--sub);margin-left:4px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--tra);font:inherit;font-size:14px;padding:10px}
.note{font-size:12px;color:var(--sub);padding:4px 16px 12px}
.banner{background:var(--pick);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
details{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:12px 16px}
summary{font-weight:600;font-size:15px;cursor:pointer}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
input{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.btn{margin-top:14px;width:100%;font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--chip);color:var(--ink);margin-top:8px}
.ty{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px;border:1px solid var(--mrt);color:var(--mrt)}
.ty.E{background:var(--mrt);color:#fff}
.ty.S{border-color:var(--warn);color:var(--warn)}
.plat{font-size:12px;color:var(--sub);padding:0 16px 8px}
.plat b{color:var(--ink);font-weight:600}
td.dash{color:var(--sub)}
.ver{text-align:center;font-size:12px;color:var(--sub);margin-top:14px}
.msg{font-size:13px;margin-top:8px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <div><div class="clock" id="clock">--:--</div><div class="date"><span id="date"></span> ・ v1.4</div></div>
  <div class="seg"><button id="bAM">上班</button><button id="bPM">下班</button></div>
</header>
<div class="status"><span class="dot" id="dot"></span><span id="stxt">載入中</span></div>
<div id="banner"></div>
<div class="plan" id="plan"></div>
<div id="lists"></div>
<details id="set">
  <summary>設定</summary>
  <label>TDX Client Id</label><input id="cid" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label>TDX Client Secret</label><input id="csec" type="password" autocomplete="off">
  <div class="row2">
    <div><label>機捷 A1 ↔ 台鐵/高鐵 步行（分）</label><input id="walk" type="number" inputmode="numeric"></div>
    <div><label>南港車站月台 ↔ 辦公室（分）</label><input id="exit" type="number" inputmode="numeric"></div>
  </div>
  <div class="row2">
    <div><label>上班要到辦公室的時間</label><input id="target" type="time"></div>
    <div><label>幾點後自動切到下班</label><input id="switch" type="time"></div>
  </div>
  <button class="btn" id="save">儲存</button>
  <button class="btn ghost" id="clear">清除金鑰</button>
  <div class="msg" id="setmsg">金鑰只存在這支手機的瀏覽器裡，不會上傳到任何地方（除了 TDX 官方換 token）。</div>
</details>
<div class="ver">版本 v1.4・2026-11-03</div>

/* ---------- time helpers (Asia/Taipei) ---------- */
function nowTPE(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short',hourCycle:'h23'})
    .formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{});
  return {date:`${p.year}-${p.month}-${p.day}`, min:+p.hour*60 + +p.minute, sec:+p.second, wd:p.weekday, hm:`${p.hour}:${p.minute}`};
}
const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const fmt = m => { m = ((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
// arrival after midnight => +1440
function span(dep, arr){ let a = toMin(arr), d = toMin(dep); if (a < d) a += 1440; return [d, a]; }

// best train you can still board at `ready` (minutes), counting live delays
function bestCatch(list, ready, useDelay){
  let best = -1, bestArr = Infinity;
  list.forEach((r, i) => {
    const d = useDelay ? (delays[r.no] || 0) : 0;
    if (r.dep + d >= ready && r.dep <= ready + 60 && r.arr + d < bestArr){ best = i; bestArr = r.arr + d; }
  });
  return best < 0 ? list.length : best;
}

/* ---------- normalise rows: {dep, arr, no, kind} in minutes ---------- */
const TYPE = {C:'普通', E:'直達', S:'跳站'};
// AM row: [type, A9 dep|null, A8 dep|null, A1 arr]
function rowsMRTam(list){ return list.map(([ty,d9,d8,a]) => {
  const first = d9 || d8, [f,arr] = span(first, a);
  const t9 = d9 ? f : null, t8 = d8 ? span(first, d8)[1] : null;
  return {ty, t9, t8, arr, dep: t9 ?? t8};
}); }
// PM row: [type, A1 dep, A8 arr|null, A9 arr|null]
function rowsMRTpm(list){ return list.map(([ty,d1,a8,a9]) => {
  const dep = toMin(d1), fix = s => s ? span(d1, s)[1] : null;
  const t8 = fix(a8), t9 = fix(a9);
  return {ty, dep, t8, t9, arr: t9 ?? t8};
}); }
const TRA_KIND = {L:'區間', F:'區間快', Z:'自強', J:'莒光', R:'復興', P:'普快'};

const TPASS_CODE = {'6':'L','10':'F','3':'Z','4':'J','5':'R','7':'P'};
function rowsTRA(list){ return list.map(([d,a,no,k]) => { const [dm,am] = span(d,a); return {dep:dm, arr:am, no, kind:TRA_KIND[k]||k}; }); }
function rowsHSR(list){ return list.map(([d,a,no]) => { const [dm,am] = span(d,a); return {dep:dm, arr:am, no}; }); }

/* ---------- TDX ---------- */
let tokPending = null;
function token(){
  if (!cred) return Promise.resolve(null);
  const c = store.get('tok', null);
  if (c && c.exp > Date.now() + 60000) return Promise.resolve(c.t);
  if (!tokPending) tokPending = fetchToken().finally(() => { tokPending = null; });
  return tokPending;
}
async function fetchToken(){
  const r = await fetch(TDX + '/auth/realms/TDXConnect/protocol/openid-connect/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'client_credentials', client_id:cred.id, client_secret:cred.secret})
  });
  if (!r.ok) throw new Error(r.status === 400 || r.status === 401 ? '金鑰錯誤' : 'token ' + r.status);
  const j = await r.json();
  store.set('tok', {t:j.access_token, exp:Date.now() + (j.expires_in||86400)*1000});
  return j.access_token;
}
async function api(path){
  const t = await token();
  const r = await fetch(TDX + '/api/basic' + path + (path.includes('?')?'&':'?') + '$format=JSON', {headers:{authorization:'Bearer ' + t}});
  if (r.status === 401) { store.del('tok'); throw new Error('token 失效'); }
  if (!r.ok) throw new Error('TDX ' + r.status);
  return r.json();
}
async function loadDaily(date){
  const cache = store.get('daily', null);
  if (cache && cache.date === date && cache.v === 2) return cache;
  const tra = async (o,d) => (await api(`/v3/Rail/TRA/DailyTrainTimetable/OD/${o}/to/${d}/${date}`)).TrainTimetables
      .filter(x => TPASS_CODE[x.TrainInfo.TrainTypeCode])
      .map(x => [x.StopTimes[0].DepartureTime, x.StopTimes[1].ArrivalTime, x.TrainInfo.TrainNo, TPASS_CODE[x.TrainInfo.TrainTypeCode]])
      .sort((a,b) => a[0] < b[0] ? -1 : 1);
  const hsr = async (o,d) => (await api(`/v2/Rail/THSR/DailyTimetable/OD/${o}/to/${d}/${date}`))
      .map(x => [x.OriginStopTime.DepartureTime, x.DestinationStopTime.ArrivalTime, x.DailyTrainInfo.TrainNo])
      .sort((a,b) => a[0] < b[0] ? -1 : 1);
  const [ta, tp, ha, hp] = await Promise.all([tra(ST.TPE_TRA,ST.NG_TRA), tra(ST.NG_TRA,ST.TPE_TRA), hsr(ST.TPE_HSR,ST.NG_HSR), hsr(ST.NG_HSR,ST.TPE_HSR)]);
  const out = {v:2, date, traAM:ta, traPM:tp, hsrAM:ha, hsrPM:hp};
  store.set('daily', out);
  return out;
}
async function loadDelays(nos){
  if (!nos.length) return;
  const f = encodeURIComponent(nos.map(n => `TrainNo eq '${n}'`).join(' or '));
  const j = await api(`/v2/Rail/TRA/LiveTrainDelay?$filter=${f}`);
  const d = {}; j.forEach(x => d[x.TrainNo] = x.DelayTime);
  nos.forEach(n => { delays[n] = d[n] ?? 0; });
}
async function refresh(){
  if (!cred){ live = {ok:false, msg:'使用內建時刻表（設定 TDX 金鑰可看台鐵誤點）'}; render(); return; }
  try{
    const n = nowTPE();
    const d = await loadDaily(n.date);
    data.traAM = rowsTRA(d.traAM); data.traPM = rowsTRA(d.traPM);
    data.hsrAM = rowsHSR(d.hsrAM); data.hsrPM = rowsHSR(d.hsrPM);
    const traList = mode === 'AM' ? data.traAM : data.traPM;
    const upcoming = traList.filter(r => r.dep >= n.min - 5).slice(0, 10).map(r => r.no);
    await loadDelays(upcoming);
    live = {ok:true, msg:'TDX 即時連線中', at:n.hm};
  }catch(e){
    live = {ok:false, msg:'TDX 連線失敗（' + e.message + '），改用內建時刻表'};
  }
  render();
}

/* ---------- rendering ---------- */
function minsFrom(now, t){ const d = t - now; return d < 0 ? '已發車' : d === 0 ? '即將發車' : d < 60 ? d + ' 分後' : ''; }
function delayCell(no){
  if (!live.ok) return '';
  const d = delays[no];
  if (d === undefined) return '';
  return d > 0 ? `<span class="late">晚 ${d} 分</span>` : '<span class="ontime">準點</span>';
}
function firstIdx(list, t){ const i = list.findIndex(r => r.dep >= t); return i < 0 ? list.length : i; }

function render(){
  const n = nowTPE();
  const now = n.min;
  $('clock').textContent = n.hm;
  const wdZh = {Mon:'一',Tue:'二',Wed:'三',Thu:'四',Fri:'五',Sat:'六',Sun:'日'}[n.wd];
  $('date').textContent = `${n.date.slice(5).replace('-','/')}（${wdZh}）`;
  $('bAM').classList.toggle('on', mode==='AM'); $('bPM').classList.toggle('on', mode==='PM');
  $('dot').className = 'dot ' + (live.ok ? 'live' : 'off');
  $('stxt').textContent = live.msg + (live.ok && live.at ? `・${live.at} 更新` : '');
  $('banner').innerHTML = (n.wd === 'Sat' || n.wd === 'Sun')
    ? '<div class="banner">今天是假日，機捷顯示的是平日班次，僅供參考。</div>' : '';

  const walk = +cfg.walk, exit = +cfg.exit;
  const AM = mode === 'AM';
  let html = '', plan = '';

  if (AM){
    const mrt = data.mrtAM;
    const start = firstIdx(mrt, now);
    if (pickedIdx === null || pickedIdx < start){
      const j = mrt.findIndex((r, i) => i >= start && r.t9 !== null && r.t9 >= now);
      pickedIdx = j >= 0 ? j : Math.min(start, mrt.length-1);
    }
    const m = mrt[pickedIdx];
    const ready = m ? m.arr + walk : 9999;
    const tra = data.traAM, hsr = data.hsrAM;
    const ti = bestCatch(tra, ready, live.ok), hi = firstIdx(hsr, ready);
    const tBest = tra[ti], hBest = hsr[hi];
    const tg = toMin(cfg.target);
    const legOpt = (r, cls, label) => {
      if (!r) return '';
      const d = cls === 'tra' ? (delays[r.no] || 0) : 0;
      const end = r.arr + d + exit;
      const v = end <= tg - 3 ? 'ok' : end <= tg ? 'warn' : 'bad';
      return `<div class="leg"><span class="tag t-${cls}">${label}</span><b>${fmt(r.dep)}</b><span class="s">→ ${fmt(r.arr)}${d?`（晚 ${d}）`:''}・${cls==='tra'?'4 月台':r.no}</span>
        <span class="s" style="margin-left:auto">辦公室 <b style="font-size:15px" class="verdict ${v}">${fmt(end)}</b></span></div>`;
    };
    plan = m ? `<h2>你點選的機捷班次，最快的轉乘方式</h2><div class="route">
      <div class="leg"><span class="tag t-mrt">機捷</span><b>${fmt(m.dep)}</b><span class="s">${m.t9 !== null ? 'A9' : 'A8'} ${TYPE[m.ty]} → A1 ${fmt(m.arr)}・${m.arr-m.dep} 分</span></div>
      <div class="leg"><span class="tag t-walk">步行</span><span class="s">約 ${walk} 分，${fmt(ready)} 可上車</span></div>
      ${legOpt(tBest,'tra','台鐵')}${legOpt(hBest,'hsr','高鐵')}</div>
      <div class="verdict ${verdictCls(tBest,hBest)}">${verdictTxt(tBest,hBest)}</div>` : '<h2>今天的機捷已經收班</h2>';
    function arrive(r, cls){ return r ? r.arr + (cls==='tra' ? (delays[r.no]||0) : 0) + exit : 9999; }
    function verdictCls(t,h){ const b = Math.min(arrive(t,'tra'), arrive(h,'hsr')); return b <= tg-3 ? 'ok' : b <= tg ? 'warn' : 'bad'; }
    function verdictTxt(t,h){ const b = Math.min(arrive(t,'tra'), arrive(h,'hsr')); const d = tg - b;
      return d >= 0 ? `${cfg.target} 前到辦公室，還有 ${d} 分緩衝` : `會比 ${cfg.target} 晚 ${-d} 分`; }

    html += listMRTam(mrt, start, now);
    html += listTRA('台鐵 台北 → 南港（TPASS 可搭）', tra, Math.max(firstIdx(tra, now), ti - 1), now, ti, PLAT.traAM);
    html += listHSR('高鐵 台北 → 南港（自由座）', hsr, Math.max(firstIdx(hsr, now), hi - 1), now, hi, PLAT.hsrAM);
  } else {
    const tra = data.traPM, hsr = data.hsrPM, mrt = data.mrtPM;
    const atStn = now + exit;  // walk from office to the platform first
    const ts = firstIdx(tra, atStn), hs = firstIdx(hsr, atStn);
    const tIdx = bestCatch(tra, atStn, live.ok);
    const t = tra[tIdx], h = hsr[hs];
    const conn = (r, cls) => {
      if (!r) return null;
      const d = cls === 'tra' ? (delays[r.no]||0) : 0;
      const ready = r.arr + d + walk;
      const mi = mrt.findIndex(m => m.dep >= ready && m.t9 !== null);
      return {r, d, ready, m: mi >= 0 ? mrt[mi] : null, mi};
    };
    const ct = conn(t,'tra'), ch = conn(h,'hsr');
    const best = [ct, ch].filter(x => x && x.m).sort((a,b) => a.m.arr - b.m.arr)[0];
    const line = (c, cls, label) => c ? `<div class="leg"><span class="tag t-${cls}">${label}</span><b>${fmt(c.r.dep)}</b><span class="s">→ ${fmt(c.r.arr)}${c.d?`（晚 ${c.d}）`:''}</span>
      <span class="s" style="margin-left:auto">${c.m ? '接機捷 ' + fmt(c.m.dep) : '機捷已收班'}</span></div>` : '';
    plan = `<h2>現在離開辦公室，最快回到林口</h2><div class="route"><div class="leg"><span class="tag t-walk">步行</span><span class="s">辦公室到月台約 ${exit} 分，${fmt(atStn)} 可上車</span></div>${line(ct,'tra','台鐵')}${line(ch,'hsr','高鐵')}
      <div class="leg"><span class="tag t-walk">步行</span><span class="s">台北車站轉機捷約 ${walk} 分</span></div></div>
      ${best ? `<div class="verdict ok">最快 ${fmt(best.m.arr)} 到 A9 林口（搭${best===ct?'台鐵':'高鐵'}）</div>` : '<div class="verdict bad">今天已經沒有可接的班次</div>'}`;
    html += listTRA('台鐵 南港 → 台北（TPASS 可搭）', tra, ts, now, tIdx, PLAT.traPM);
    html += listHSR('高鐵 南港 → 台北（自由座）', hsr, hs, now, hs, PLAT.hsrPM);
    html += listMRTpm(mrt, best ? Math.max(firstIdx(mrt, now), best.mi - 2) : firstIdx(mrt, now), now, best ? best.mi : null);
  }
  $('plan').innerHTML = plan;
  $('lists').innerHTML = html;
  document.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => { pickedIdx = +tr.dataset.i; render(); });
  document.querySelectorAll('.more').forEach(b => b.onclick = () => { expand[b.dataset.k] = !expand[b.dataset.k]; render(); });
}

function rowsSlice(list, start, key){
  const n = expand[key] ? 30 : 7;
  return list.slice(Math.max(0, start - 1), start + n).map((r, j) => ({r, i: Math.max(0, start-1) + j}));
}
function moreBtn(key){ return `<button class="more" data-k="${key}">${expand[key] ? '收合' : '顯示更多班次'}</button>`; }

const PLAT = {
  traAM: '台北站 <b>B2 第四月台</b> 上車（往松山、七堵方向）→ 南港站 <b>B3 第一月台</b> 下車',
  traPM: '南港站 <b>B3 第二月台</b> 上車（往台北方向）→ 台北站 <b>B2 第三月台</b> 下車',
  hsrAM: '台北站通常在 <b>第二月台（2A/2B）</b> 上車，以月台看板為準；南港站下車月台不固定',
  hsrPM: '南港站 <b>1～3 月台不固定</b>，請看大廳看板；台北站在 <b>第一月台</b> 下車'
};
const tyTag = ty => `<span class="ty ${ty}">${TYPE[ty]}</span>`;
const tm = v => v === null ? '<td class="dash">—</td>' : `<td>${fmt(v)}</td>`;
function listMRTam(list, start, now){
  const key = 'mrt';
  const rows = rowsSlice(list, start, key).map(({r,i}) => `
    <tr data-i="${i}" class="${r.dep < now ? 'gone' : ''} ${i === pickedIdx ? 'pick' : ''}">
      <td>${tyTag(r.ty)}</td>${r.t9 === null ? '<td class="dash">—</td>' : `<td><b>${fmt(r.t9)}</b></td>`}${tm(r.t8)}<td>${fmt(r.arr)}</td>
      <td class="r n">${r.arr - r.dep} 分</td></tr>`).join('');
  return `<section><h3><span class="bar" style="background:var(--mrt)"></span>機捷 → A1 台北車站</h3>
    <table><tr><th>車種</th><th>A9 林口<br>出發</th><th>A8 長庚<br>出發</th><th>A1 台北<br>抵達</th><th class="r">車程</th></tr>${rows}</table>
    <div class="note">直達車不停 A9，只能從 A8 上車。跳站車由 A21 發車，從 A9 起每站停。點一班機捷，上方會算出接得上的台鐵和高鐵。</div>${moreBtn(key)}</section>`;
}
function listMRTpm(list, start, now, hi){
  const key = 'mrt';
  const rows = rowsSlice(list, start, key).map(({r,i}) => `
    <tr class="${r.dep < now ? 'gone' : ''} ${i === hi ? 'pick' : ''}">
      <td>${tyTag(r.ty)}</td><td><b>${fmt(r.dep)}</b></td>${tm(r.t8)}${tm(r.t9)}
      <td class="r n">${r.arr - r.dep} 分</td></tr>`).join('');
  return `<section><h3><span class="bar" style="background:var(--mrt)"></span>機捷 A1 台北車站 →</h3>
    <table><tr><th>車種</th><th>A1 台北<br>出發</th><th>A8 長庚<br>抵達</th><th>A9 林口<br>抵達</th><th class="r">車程</th></tr>${rows}</table>
    <div class="note">直達車不停 A9，只到 A8。車程算到最後一個停靠的站。</div>${moreBtn(key)}</section>`;
}
function listTRA(title, list, start, now, hi, plat){
  const key = 'tra';
  const rows = rowsSlice(list, start, key).map(({r,i}) => `
    <tr class="${r.dep < now ? 'gone' : ''} ${i === hi ? 'pick' : ''}">
      <td><b>${fmt(r.dep)}</b></td><td>${fmt(r.arr)}</td><td class="n">${r.kind} ${r.no}</td>
      <td class="r">${delayCell(r.no) || `<span class="mins">${minsFrom(now, r.dep)}</span>`}</td></tr>`).join('');
  return `<section><h3><span class="bar" style="background:var(--tra)"></span>${title}</h3><div class="plat">${plat}<br>不含 EMU3000 新自強號、普悠瑪、太魯閣（TPASS 不能搭）</div>
    <table><tr><th>出發</th><th>抵達</th><th>車次</th><th></th></tr>${rows}</table>${moreBtn(key)}</section>`;
}
function listHSR(title, list, start, now, hi, plat){
  const key = 'hsr';
  const rows = rowsSlice(list, start, key).map(({r,i}) => `
    <tr class="${r.dep < now ? 'gone' : ''} ${i === hi ? 'pick' : ''}">
      <td><b>${fmt(r.dep)}</b></td><td>${fmt(r.arr)}</td><td class="n">${r.no}</td>
      <td class="r mins">${minsFrom(now, r.dep)}</td></tr>`).join('');
  return `<section><h3><span class="bar" style="background:var(--hsr)"></span>${title}<span class="sub">無即時誤點</span></h3><div class="plat">${plat}</div>
    <table><tr><th>出發</th><th>抵達</th><th>車次</th><th></th></tr>${rows}</table>${moreBtn(key)}</section>`;
}

/* ---------- mode & settings ---------- */
function autoMode(){ return nowTPE().min < toMin(cfg.switch) ? 'AM' : 'PM'; }
function setMode(m){ if (m !== mode){ mode = m; pickedIdx = null; expand = {}; render(); refresh(); } }
$('bAM').onclick = () => setMode('AM');
$('bPM').onclick = () => setMode('PM');

$('cid').value = cred ? cred.id : '';
$('csec').value = cred ? cred.secret : '';
$('walk').value = cfg.walk; $('exit').value = cfg.exit; $('target').value = cfg.target; $('switch').value = cfg.switch;
$('save').onclick = async () => {
  Object.assign(cfg, {walk:+$('walk').value || 12, exit:+$('exit').value || 10, target:$('target').value || '09:00', switch:$('switch').value || '13:30'});
  store.set('cfg', cfg);
  const id = $('cid').value.trim(), sec = $('csec').value.trim();
  if (id && sec){ store.set('cred', {id, secret:sec}); store.del('tok'); store.del('daily'); location.reload(); }
  else { $('setmsg').textContent = '已儲存。'; render(); }
};
$('clear').onclick = () => { store.del('cred'); store.del('tok'); store.del('daily'); location.reload(); };

mode = autoMode();
render();
refresh();
setInterval(render, 15000);
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ render(); refresh(); } });
</script>
</body>
</html>
